[project]
name = "trial-matcher-tools"
version = "0.1.0"
description = "Clinical trial matching tools service (FastAPI, OpenAPI tool for Foundry agent)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.4",
  "uvicorn[standard]==0.32.0",
  "gunicorn==23.0.0",
  "pydantic==2.9.2",
  "opentelemetry-api==1.28.2",
  "opentelemetry-sdk==1.28.2",
  "opentelemetry-instrumentation-fastapi==0.49b2",
  "azure-monitor-opentelemetry==1.6.4",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "httpx==0.27.2", "ruff==0.7.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
