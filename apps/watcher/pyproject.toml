[project]
name = "trial-matcher-watcher"
version = "0.1.0"
description = "Background watcher that scores clinical trials against saved patient profiles using an in-cluster small model."
requires-python = ">=3.12"
dependencies = [
  "httpx==0.27.2",
  "pydantic==2.9.2",
  "redis==5.2.0",
  "opentelemetry-api==1.28.2",
  "opentelemetry-sdk==1.28.2",
  "azure-monitor-opentelemetry==1.6.4",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.7.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
