{{- /* Single-pod Redis for watch state. No PVC — state resets if pod restarts.
   That's fine for a demo; Step 5 polish can swap to a PVC if needed. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "trial-matcher.labels" . | nindent 4 }}
    component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        {{- include "trial-matcher.labels" . | nindent 8 }}
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "trial-matcher.labels" . | nindent 4 }}
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
