{{- range $svc := list "tools" "api" "frontend" }}
{{- $port := 8000 }}
{{- if eq $svc "frontend" }}{{ $port = 8080 }}{{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc }}
  labels:
    {{- include "trial-matcher.labels" $ | nindent 4 }}
    component: {{ $svc }}
spec:
  replicas: {{ index $.Values.autoscaling $svc "min" }}
  selector:
    matchLabels:
      app: {{ $svc }}
  template:
    metadata:
      labels:
        {{- include "trial-matcher.labels" $ | nindent 8 }}
        app: {{ $svc }}
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: trial-matcher
      containers:
        - name: {{ $svc }}
          image: "{{ $.Values.image.registry }}/agentic-devops-demo/{{ $svc }}-demo:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $port }}
          env:
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              value: {{ $.Values.appInsights.connectionString | quote }}
            {{- if eq $svc "api" }}
            - name: FOUNDRY_MODE
              value: "real"
            - name: FOUNDRY_PROJECT_ENDPOINT
              value: {{ $.Values.foundry.endpoint | quote }}
            - name: FOUNDRY_AGENT_NAME
              value: {{ $.Values.foundry.agentName | quote }}
            - name: FOUNDRY_MODEL_DEPLOYMENT_NAME
              value: {{ $.Values.foundry.modelDeploymentName | quote }}
            - name: TOOLS_SERVICE_URL
              value: "http://tools:8000"
            - name: TOOLS_API_KEY
              value: "demo-key"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: AZURE_CLIENT_ID
              value: {{ $.Values.azureClientId | quote }}
            {{- end }}
            {{- if eq $svc "frontend" }}
            - name: API_HOST
              value: "api:8000"
            - name: API_SCHEME
              value: "http"
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ if eq $svc "frontend" }}/healthz{{ else }}/readyz{{ end }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml (index $.Values.resources $svc) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc }}
  labels:
    {{- include "trial-matcher.labels" $ | nindent 4 }}
spec:
  selector:
    app: {{ $svc }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $svc }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $svc }}
  minReplicas: {{ index $.Values.autoscaling $svc "min" }}
  maxReplicas: {{ index $.Values.autoscaling $svc "max" }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ index $.Values.autoscaling $svc "targetCPU" }}
{{- end }}
