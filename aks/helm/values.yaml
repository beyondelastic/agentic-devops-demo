image:
  registry: ""               # ACR login server, e.g. mydemo.azurecr.io
  tag: latest
  pullPolicy: Always

# Workload identity client id (federated to AKS workload identity).
azureClientId: ""

foundry:
  endpoint: ""               # e.g. https://<acct>.services.ai.azure.com/api/projects/tm-project
  agentName: clinical-trial-matcher
  modelDeploymentName: gpt-4o-mini

appInsights:
  connectionString: ""

ingress:
  enabled: true
  className: nginx
  host: trial-matcher.example.com

resources:
  api:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: 1,    memory: 1Gi }
  tools:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  frontend:
    requests: { cpu: 50m,  memory: 128Mi }
    limits:   { cpu: 250m, memory: 256Mi }
  watcher:
    requests: { cpu: 50m,  memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }

autoscaling:
  api:      { min: 2, max: 20, targetCPU: 70 }
  # tools state is in-memory (added demo trials live per-pod), keep it at 1
  # for the demo so injected trials are deterministically visible.
  tools:    { min: 1, max: 1,  targetCPU: 70 }
  frontend: { min: 2, max: 5,  targetCPU: 70 }

watcher:
  localModelUrl: "http://workspace-llama-3-3b"
  localModelName: "llama-3.2-3b-instruct"
  tickSeconds: 45
  maxTrials: 5
  logLevel: "INFO"
