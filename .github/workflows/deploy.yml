name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Federated identity / OIDC.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME || 'demo' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
  AZURE_AI_LOCATION: ${{ vars.AZURE_AI_LOCATION || 'eastus2' }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-aullah-agentic-devops' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: azd login (federated)
        run: |
          azd auth login \
            --client-id "${{ secrets.AZURE_CLIENT_ID }}" \
            --federated-credential-provider github \
            --tenant-id "${{ secrets.AZURE_TENANT_ID }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: azd env config
        run: |
          azd env new "${AZURE_ENV_NAME}" --no-prompt || true
          azd env set AZURE_SUBSCRIPTION_ID "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_LOCATION "${AZURE_LOCATION}"
          azd env set AZURE_AI_LOCATION "${AZURE_AI_LOCATION}"
          azd env set AZURE_RESOURCE_GROUP "${AZURE_RESOURCE_GROUP}"

      - name: azd up
        run: azd up --no-prompt
        env:
          AZURE_ENV_NAME: ${{ env.AZURE_ENV_NAME }}
          GIT_SHA: ${{ github.sha }}
          BUILT_AT: ${{ github.event.head_commit.timestamp }}

      - name: Print frontend URL
        run: |
          azd env get-values | grep -E '^FRONTEND_URL=' || true
