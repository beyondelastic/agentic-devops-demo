name: Lint

on:
  pull_request:
    branches: [main]

jobs:
  ruff:
    name: ruff (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [apps/api, apps/tools]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run ruff
        working-directory: ${{ matrix.service }}
        run: ruff check .
